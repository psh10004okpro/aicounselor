[pytest]
# Pytest configuration for AI Counselor Backend

# Minimum pytest version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Add options
addopts =
    -v
    -l
    -ra
    --cov=app
    --cov-report=html
    --cov-report=term-missing
    --strict-markers
    -W ignore::DeprecationWarning
    --asyncio-mode=auto

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    asyncio: Async tests
